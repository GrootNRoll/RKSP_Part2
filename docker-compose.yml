version: '3.8'

services:
  app:
    build: .
    ports:
      - "${HOST_PORT:-8080}:5000"
    environment:
      - DATABASE_URL=postgresql://equser:eqpass123@db:5432/eqdb
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: equser
      POSTGRES_PASSWORD: eqpass123
      POSTGRES_DB: eqdb
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equser -d eqdb"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - app_net

volumes:
  pg_data:

networks:
  app_net:
    driver: bridge